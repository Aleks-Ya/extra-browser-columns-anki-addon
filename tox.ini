[tox]
requires =
    tox>=4
env_list =
    anki-current
skipsdist = True

[testenv]
description = run unit tests
passenv = *
setenv =
    QT_QPA_PLATFORM = offscreen
commands =
    pytest -v --cov=extra_browser_columns --cov-report=xml --cov-config=tox.ini --cov-branch

[testenv:anki-current]
deps =
    -r requirements/tests.txt
    -r requirements/anki-current.txt
commands =
    {[testenv]commands} {posargs:tests}
